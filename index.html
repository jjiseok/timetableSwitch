<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>교과 시간표 교체 검색기 (다중 교체 지원)</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <script src="js/tailwind-config.js"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="font-sans antialiased text-google-text text-[13px]">

    <header class="app-bar flex items-center justify-between px-4 py-2">
        <div class="flex items-center gap-2">
            <span class="material-symbols-outlined text-google-blue text-2xl">calendar_month</span>
            <h1 class="text-base font-bold tracking-tight text-google-text flex items-center gap-2">
                시간표 교체 검색기
                <span class="bg-google-blue/10 text-google-blue text-[10px] px-2 py-0.5 rounded-full font-bold hidden md:inline-block">다중 교체 지원</span>
            </h1>
        </div>

        <div class="flex items-center gap-2">
            <div id="result-msg" class="font-medium text-[13px] text-google-textSecondary hidden lg:block mr-2">
                시간표 파일(.xlsx)을 업로드해주세요.
            </div>
            <button id="btn-reset" class="hidden flex items-center gap-1 bg-white text-google-textSecondary border border-google-border hover:bg-google-bg font-medium px-3 py-1.5 rounded-full shadow-sm transition-all text-xs">
                <span class="material-symbols-outlined text-[16px]">refresh</span> 초기화
            </button>
            <button id="btn-export" class="hidden flex items-center gap-1 bg-white text-google-blue border border-google-border hover:bg-blue-50 font-medium px-3 py-1.5 rounded-full shadow-sm transition-all text-xs">
                <span class="material-symbols-outlined text-[16px]">ios_share</span> 파일 내보내기
            </button>
            <button id="btn-download-template" class="flex items-center gap-1 bg-white text-google-green border border-google-border hover:bg-green-50 font-medium px-3 py-1.5 rounded-full shadow-sm transition-all text-xs">
                <span class="material-symbols-outlined text-[16px]">download</span> <span class="hidden sm:inline">양식 다운로드</span><span class="sm:hidden">양식</span>
            </button>
            <label for="excel-file" class="flex items-center gap-1 bg-google-blue hover:bg-google-blueHover text-white font-medium px-4 py-1.5 rounded-full shadow-google hover:shadow-google-hover cursor-pointer transition-all text-xs">
                <span class="material-symbols-outlined text-[18px]">upload_file</span> 파일 열기
            </label>
            <input type="file" id="excel-file" accept=".xlsx, .xls" class="hidden">
        </div>
    </header>

    <main class="p-3 max-w-[99%] mx-auto">
        <div id="mobile-result-msg" class="lg:hidden font-medium text-xs text-google-textSecondary mb-2 text-center"></div>

        <section id="drop-zone" class="drop-zone mb-3" role="button" tabindex="0" aria-label="엑셀 시간표 파일 드래그 앤 드롭 또는 파일 선택">
            <div class="drop-zone-icon">
                <span class="material-symbols-outlined">upload_file</span>
            </div>
            <div class="drop-zone-text">
                <strong>엑셀 시간표 파일을 여기에 드래그하세요.</strong>
                <span>.xlsx 또는 .xls 파일을 끌어다 놓거나, 이 영역을 클릭해서 파일을 열 수 있습니다.</span>
            </div>
            <div class="drop-zone-badge">드래그 앤 드롭 지원</div>
        </section>

        <div id="panel-2way" class="p-3 mb-3 rounded-md shadow-sm flex flex-col md:flex-row justify-between items-center bg-white transition-all hidden-panel">
            <div id="msg-2way" class="text-google-text text-xs md:text-[13px] mb-3 md:mb-0 leading-relaxed w-full md:w-auto flex-1 md:pr-4"></div>
            <button id="btn-2way" class="flex shrink-0 items-center gap-1.5 bg-white text-google-blue border border-google-border hover:bg-google-blue/5 font-medium px-4 py-1.5 rounded-full shadow-sm transition-colors whitespace-nowrap text-xs hidden">
                <span class="material-symbols-outlined text-[18px]">sync</span> 다중 교체 탐색하기
            </button>
        </div>

        <div class="table-container hidden" id="table-wrapper">
            <div id="table-inner-wrapper" class="relative inline-block min-w-full align-top">
                <table id="main-table">
                    <thead id="table-head"></thead>
                    <tbody id="table-body"></tbody>
                </table>
                <svg id="arrow-svg" class="absolute top-0 left-0 pointer-events-none z-[60]" style="width: 100%; height: 100%;">
                    <defs>
                        <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                            <polygon points="0 0, 10 3.5, 0 7" fill="#1e8e3e"></polygon>
                        </marker>
                    </defs>
                    <g id="arrow-layer"></g>
                </svg>
            </div>
        </div>
    </main>

    <!-- 기능별 모듈. file://에서도 실행되도록 ES Module 대신 일반 script 방식으로 분리했습니다. -->
    <script src="js/state.js"></script>
    <script src="js/dom.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/messages.js"></script>
    <script src="js/arrows.js"></script>
    <script src="js/table.js"></script>
    <script src="js/excel.js"></script>
    <script src="js/swap.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
